name: React DevSecOps - Staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read
  security-events: write

env:
  IMAGE_NAME: aws-devops-react
  APP_PATH: app

jobs:

##############################################################################
# Checkout
##############################################################################

  checkout:

    runs-on: ubuntu-latest

    outputs:
      sha: ${{ github.sha }}

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: .

##############################################################################
# Security Job (Parallel)
##############################################################################
 security:
  runs-on: ubuntu-latest

  steps:

    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

##############################################################################
# Quality Job (Parallel)
##############################################################################

  quality:

    runs-on: ubuntu-latest

    needs: checkout

    defaults:
      run:
        working-directory: app

    steps:

      - uses: actions/download-artifact@v4
        with:
          name: source

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run lint

##############################################################################
# Dependency Scan (Parallel)
##############################################################################

  dependency-scan:

    runs-on: ubuntu-latest

    needs: checkout

    defaults:
      run:
        working-directory: app

    steps:

      - uses: actions/download-artifact@v4
        with:
          name: source

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm audit --audit-level=high

##############################################################################
# Build Job
##############################################################################

  build:

    needs:
      - security
      - quality
      - dependency-scan

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: app/dist

##############################################################################
# Docker Build
##############################################################################

  docker:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/aws-devops-react:staging

##############################################################################
# Trivy (Parallel)
##############################################################################

  trivy:

    needs: docker

    runs-on: ubuntu-latest

    steps:

      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/aws-devops-react:staging
          exit-code: '0'
          severity: CRITICAL

##############################################################################
# Hadolint (Parallel)
##############################################################################

  hadolint:

    needs: docker

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

##############################################################################
# Push Image
##############################################################################

  publish:

    needs:
      - trivy
      - hadolint

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aws-devops-react:staging
            ${{ secrets.DOCKERHUB_USERNAME }}/aws-devops-react:${{ github.sha }}
