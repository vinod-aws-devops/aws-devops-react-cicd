name: QA CI Pipeline

on:
  push:
    branches:
      - "feature/**"

  pull_request:
    branches:
      - staging

permissions:
  contents: read
  security-events: write

jobs:

  qa:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/aws-devops-react

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Application
        run: npm run lint

      - name: Build React Application
        run: npm run build

      ###################################
      # Gitleaks
      ###################################

      - name: Secret Scan
        uses: gitleaks/gitleaks-action@v2

      ###################################
      # Semgrep
      ###################################

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1

      ###################################
      # Docker Buildx
      ###################################

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      ###################################
      # Login DockerHub
      ###################################

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      ###################################
      # Build Docker Image
      ###################################

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:qa-${{ github.run_number }}
            ${{ env.IMAGE_NAME }}:qa-latest

      ###################################
      # Trivy Scan
      ###################################

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:qa-${{ github.run_number }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      ###################################
      # Push Image
      ###################################

      - name: Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:qa-${{ env.APP_VERSION }}-${{ github.run_number }}
            ${{ env.IMAGE_NAME }}:qa-${{ env.APP_VERSION }}-${{ github.sha }}